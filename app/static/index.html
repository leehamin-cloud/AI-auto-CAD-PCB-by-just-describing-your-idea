<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autonomous R&D Lab</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#e9edf5;background:#10141c}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:32px 20px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}
h1{font-size:25px;margin:0}small,.muted{color:#9aa6b8}.pill{border:1px solid #334155;border-radius:99px;padding:6px 10px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:#1a2230;border:1px solid #2b3749;border-radius:14px;padding:18px}
h2{font-size:16px;margin:0 0 12px}input,textarea,select,button{font:inherit;border-radius:8px;padding:10px;border:1px solid #3b4a60;background:#111925;color:#eef2f7;width:100%;margin:5px 0}
button{background:#315cba;border:0;cursor:pointer;font-weight:650}button:hover{filter:brightness(1.15)}
.project{border-top:1px solid #334155;padding:14px 0}.task{font-size:13px;color:#bdc8d8;margin:7px 0}
pre{white-space:pre-wrap;color:#a9bad0}
</style></head>
<body><main class="wrap">
<header><div><h1>Autonomous R&D Lab</h1><small>Phase 1 · Research / Mechanical / Electronics / Software</small></div><span class="pill" id="health">서버 확인 중</span></header>
<section class="grid">
<div class="card"><h2>프로젝트</h2><div id="projectCount">0</div><small>등록된 연구개발 프로젝트</small></div>
<div class="card"><h2>작업</h2><div id="taskCount">0</div><small>전체 작업 수</small></div>
<div class="card"><h2>완료</h2><div id="doneCount">0</div><small>완료된 작업 수</small></div>
</section>
<section class="grid" style="margin-top:14px">
<div class="card"><h2>새 프로젝트</h2><form id="projectForm"><input id="name" placeholder="프로젝트 이름" required maxlength="120"><textarea id="objective" placeholder="목표와 검증 조건" rows="3"></textarea><button>프로젝트 생성</button></form></div>
<div class="card"><h2>1차 실험 제안</h2><p class="muted">2단 평기어 감속기 · 목표 감속비 5:1</p><p class="muted">기어 치수 계산 → CAD 형상 → 간섭/강도 검토 → 제작성 평가</p><button id="seed">기어 감속기 연구 프로젝트 만들기</button></div>
</section>
<section class="card" style="margin-top:14px"><h2>프로젝트 보드</h2><div id="projects" class="muted">불러오는 중…</div></section>
<p class="muted">안전 경계: 현재 버전은 기록·계획 전용이며 모터 구동, 생성 코드 실행, 전원 제어 기능이 없습니다.</p>
</main>
<script>
async function api(path,opts={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});if(!r.ok)throw new Error(await r.text());return r.json()}
async function refresh(){
 try{
  const h=await api('/api/health');document.querySelector('#health').textContent='● '+h.status;
  const ps=await api('/api/projects');const tasks=ps.flatMap(p=>p.tasks||[]);
  projectCount.textContent=ps.length;taskCount.textContent=tasks.length;doneCount.textContent=tasks.filter(t=>t.status==='done').length;
  projects.innerHTML=ps.length?ps.map(p=>'<div class="project"><b>'+esc(p.name)+'</b><p class="muted">'+esc(p.objective)+'</p>'+((p.tasks||[]).map(t=>'<div class="task">• '+esc(t.title)+' — '+esc(t.department)+' / '+esc(t.status)+'</div>').join('')||'<small>작업 없음</small>')+'</div>').join(''):'아직 프로젝트가 없습니다.';
 }catch(e){health.textContent='서버 연결 실패';projects.textContent=e.message}
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
projectForm.addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/projects',{method:'POST',body:JSON.stringify({name:name.value,objective:objective.value})});projectForm.reset();refresh()}catch(e){alert(e.message)}});
seed.addEventListener('click',async()=>{try{const p=await api('/api/projects',{method:'POST',body:JSON.stringify({name:'2단 평기어 감속기 5:1 연구',objective:'복수의 기어 설계안을 비교하고 치수·강도·백래시·제작성 검토를 거쳐 CAD 시제품 설계를 확정한다.'})});for(const [title,department] of [['요구조건 및 설계변수 정의','research'],['기어비·모듈·잇수 후보 계산','mechanical'],['기어 강도 및 축간거리 검토','mechanical'],['FreeCAD 자동 모델 생성기 설계','mechanical'],['검증 결과 및 설계안 비교 보고서','testing']])await api('/api/projects/'+p.id+'/tasks',{method:'POST',body:JSON.stringify({title,department})});refresh()}catch(e){alert(e.message)}});
refresh();
</script></body></html>
