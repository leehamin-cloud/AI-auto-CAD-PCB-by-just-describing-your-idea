<title>Robot Forge — Engineering, reimagined.</title>
<style>
:root{color-scheme:dark;--bg:#0b1110;--bg2:#111a17;--card:#14201b;--line:#2c3b33;--text:#eaf2e7;--muted:#9caf9f;--green:#b8ff75;--green2:#82c84a;--panel:#18221e;--round:19px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text)}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}::selection{background:#b8ff75;color:#0b1110}
.notice{padding:10px 16px;text-align:center;background:#183425;border-bottom:1px solid #3e6547;color:#def5d8;font-size:12px;line-height:1.5}
.nav{height:78px;display:flex;align-items:center;gap:30px;max-width:1240px;margin:auto;padding:0 30px}.brand{font-weight:950;letter-spacing:-1.2px;font-size:23px;white-space:nowrap}.brand i{display:inline-block;width:24px;height:24px;background:var(--green);margin-right:10px;clip-path:polygon(50% 0,100% 28%,100% 72%,50% 100%,0 72%,0 28%);vertical-align:-5px}.brand span{color:var(--green)}.navlinks{display:flex;align-items:center;gap:27px;margin-left:auto}.navlinks a{font-size:13px;color:#b6c6b8}.navlinks a:hover,.navlinks a.active{color:var(--green)}.navbtn{border:1px solid #52774c;border-radius:999px;padding:11px 17px;color:var(--green);font-size:12px;font-weight:750}.burger{display:none;background:none;border:1px solid #33463b;border-radius:10px;padding:9px;color:var(--text)}
main{min-height:66vh}.container{max-width:1240px;margin:auto;padding:0 30px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2.5px;font-weight:850;color:var(--green)}.eyebrow small{color:#7a927e}.hero{padding:92px 0 96px;overflow:hidden;background:radial-gradient(ellipse at 82% 37%,#203723 0%,transparent 48%),linear-gradient(180deg,#0e1713,var(--bg))}.hero-grid{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:60px}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(52px,6.3vw,92px);letter-spacing:-5px;line-height:1.035;margin:22px 0 26px;font-weight:850}h1 em{font-style:normal;color:var(--green)}.lead{font-size:17px;line-height:1.78;color:#b4c5b7;max-width:560px}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:15px;margin:32px 0}.primary{display:inline-flex;align-items:center;gap:22px;background:var(--green);color:#0d160b;padding:16px 23px;border:0;border-radius:999px;font-weight:850;font-size:13px}.primary:hover{background:#d0ff9f}.secondary{display:inline-block;color:#d5e4d4;font-weight:700;font-size:13px;padding:14px}.small{font-size:12px;color:#8fa597;line-height:1.7}.stats{margin-top:42px;display:flex;gap:35px;border-top:1px solid #2a3b31;padding-top:25px}.stat b{display:block;font-size:26px;letter-spacing:-1px}.stat span{font-size:11px;color:#8fa597}.mock{background:#111a16;border:1px solid #456149;border-radius:17px;overflow:hidden;box-shadow:0 25px 110px #0009;min-height:400px}.mockhead{height:44px;background:#19271e;border-bottom:1px solid #344737;display:flex;align-items:center;padding:0 16px;gap:7px}.dot{width:8px;height:8px;background:#506455;border-radius:50%}.mockhead small{margin-left:10px;letter-spacing:1.4px;color:#a1b69f;font-size:9px}.mockbody{display:grid;grid-template-columns:115px 1fr 116px;height:385px}.mocksidebar,.mockright{background:#151e19;border-right:1px solid #29362e;padding:16px 9px}.mockright{border-right:0;border-left:1px solid #29362e}.mocklabel{font-size:9px;letter-spacing:1.4px;color:#718e73;margin-bottom:15px}.item{padding:9px 7px;border-radius:7px;font-size:10px;color:#96ab98}.item.on{background:#263e29;color:#c8ffa0}.canvas{position:relative;background:radial-gradient(ellipse at center,#213729,#121c17 69%);display:flex;justify-content:center;align-items:center}.canvas::before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:30px 30px}.cad-art{position:relative;width:min(100%,320px);filter:drop-shadow(0 15px 12px #0008)}.mval{font-size:10px;color:#b1c8ac;padding:11px 0;border-bottom:1px solid #354535}.mval strong{display:block;color:#d7e9cf;font-size:11px;margin-top:5px}.mval b{color:var(--green)}
.section{padding:100px 0;border-top:1px solid #203127}.sectionhead{display:flex;justify-content:space-between;gap:40px;align-items:end;margin-bottom:38px}.section h2{font-size:clamp(34px,4vw,56px);letter-spacing:-2.3px;line-height:1.14;margin:15px 0}.sectionhead p{max-width:430px;line-height:1.7;color:var(--muted);font-size:14px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#142019;border:1px solid #2d4033;border-radius:18px;padding:29px;min-height:245px}.card .glyph{font-size:26px;color:var(--green);margin-bottom:24px}.card h3{font-size:18px;margin-bottom:10px}.card p{font-size:13px;color:#9aafa0;line-height:1.75}.chip{font-size:10px;color:#9fc38e;letter-spacing:1.1px;margin-top:20px;font-weight:800}.band{background:#1a2a20;padding:90px 0}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}.pipeline{border:1px solid #3f5944;border-radius:18px;overflow:hidden;background:#101b15}.step{padding:22px 25px;border-bottom:1px solid #344b39;display:flex;gap:20px}.step:last-child{border:0}.step b{color:var(--green);font-size:12px}.step strong{font-size:15px}.step p{margin:6px 0 0;color:#90a995;font-size:12px}.pagehero{padding:75px 0 43px;background:radial-gradient(ellipse at 90% 0,#203522 0,transparent 48%)}.pagehero h1{font-size:clamp(42px,5vw,66px);letter-spacing:-3px;max-width:840px}.pagehero p{color:#9cb3a0;line-height:1.75;max-width:740px}.content{padding:40px 0 110px}.panel{background:#14211a;border:1px solid #344839;border-radius:18px;padding:30px}.cols2{display:grid;grid-template-columns:1fr 1fr;gap:17px}.field{display:block;color:#b6c4b4;font-size:13px;margin:18px 0}.field input{display:block;width:100%;background:#0b1510;border:1px solid #3d5143;color:var(--text);padding:14px;border-radius:10px;margin-top:8px}.field input:disabled{opacity:.6}.muted{color:#9bb09e;font-size:13px;line-height:1.7}.pricing{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.price{border-radius:18px;padding:29px;border:1px solid #375139;background:#16241b}.price.featured{border-color:#9fdb66;box-shadow:0 0 0 1px #aaff6740}.price h3{font-size:21px}.price b{font-size:33px}.price li{margin:13px 0;font-size:13px;color:#b6c7b7}.lineitem{padding:21px 0;border-bottom:1px solid #304135}.lineitem strong{font-size:16px}.lineitem p{color:#9caf9b;font-size:13px;line-height:1.8}.lineitem small{color:var(--green)}code{background:#263829;padding:3px 6px;border-radius:5px;color:#caff9d}.footer{border-top:1px solid #2d4031;padding:40px 0;color:#87a18c;font-size:12px}.footer .container{display:flex;justify-content:space-between;gap:15px;align-items:center}
.work{display:grid;grid-template-columns:215px minmax(0,1fr) 285px;min-height:660px;border:1px solid #314337;border-radius:15px;overflow:hidden;margin:10px 0 50px}.workside,.workinfo{background:#111e17;padding:17px;border-right:1px solid #33473a}.workinfo{border-right:0;border-left:1px solid #33473a}.workmain{background:#0e1813;min-width:0}.worktitle{font-size:11px;color:#9eb2a1;font-weight:900;letter-spacing:1.1px;margin:12px 0 15px}.worktab{display:block;width:100%;text-align:left;background:transparent;color:#91a897;border:0;border-radius:9px;padding:12px;font-size:12px}.worktab.sel{color:var(--green);background:#243b29}.viewhead{padding:16px 20px;border-bottom:1px solid #2b3a31;display:flex;justify-content:space-between;color:#adbdac;font-size:12px}.viewcenter{display:grid;place-items:center;min-height:475px;background-image:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);background-size:24px 24px}.viewfoot{padding:14px 20px;border-top:1px solid #27392e;color:#84a58c;font-size:11px}.workinfo .panel{padding:13px;background:#18271d}.workinfo label{color:#a6baa6;font-size:11px}.workinfo .field input{font-size:12px}.workinfo .primary{width:100%;justify-content:center;font-size:11px}.warn{margin-top:12px;border:1px solid #576844;border-radius:10px;background:#28331d;padding:12px;font-size:11px;color:#d7e3ba;line-height:1.6}
@media(max-width:980px){.hero-grid,.twocol{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.work{grid-template-columns:150px minmax(0,1fr)}.workinfo{grid-column:1/-1;border-top:1px solid #33473a;border-left:0}.mock{max-width:650px}.pricing{grid-template-columns:1fr 1fr}.navlinks{gap:13px}.navlinks a{font-size:11px}}
@media(max-width:700px){.nav{height:65px;padding:0 20px}.brand{font-size:19px}.navlinks{display:none;position:absolute;z-index:20;left:12px;right:12px;top:106px;background:#18241b;padding:20px;border:1px solid #4b654b;border-radius:15px;flex-direction:column;align-items:stretch}.navlinks.show{display:flex}.navbtn{display:none}.burger{display:block;margin-left:auto}.container{padding:0 20px}.hero{padding:60px 0}.hero-grid{gap:35px}h1{font-size:58px;letter-spacing:-3.5px}.stats{gap:20px}.stat b{font-size:21px}.mockbody{grid-template-columns:82px 1fr 77px;height:290px}.mocksidebar,.mockright{padding:10px 5px}.item{font-size:8px}.mval{font-size:8px}.section{padding:55px 0}.sectionhead{display:block}.cards,.pricing,.cols2{grid-template-columns:1fr}.card{min-height:195px}.twocol{gap:25px}.pagehero{padding:48px 0 20px}.pagehero h1{font-size:42px}.work{display:block}.workside{display:flex;flex-wrap:wrap;gap:5px}.workside .worktitle{width:100%}.worktab{width:auto}.viewcenter{min-height:330px}.footer .container{display:block}.footer .small{margin-top:12px}}
</style><link rel="stylesheet" href="/site-theme-sky.css?v=22"></head>
<body><div class="notice">PUBLIC PREVIEW · Browser CAD editing is available. Cloud AI, sign-in, verified STEP and server storage are not yet enabled.</div>
<header class="nav"><a class="brand" href="/"><i></i>ROBOT <span>FORGE</span></a><nav class="navlinks" id="navlinks"><a href="/">Home</a><a href="/workspace/">Workspace</a><a href="/plans/">Plans</a><a href="/docs/">Docs</a><a href="/release-notes/">Release notes</a><a href="/careers/">Careers</a><a href="/login/">Sign in</a></nav><button class="burger" id="burger" aria-label="Open navigation">☰</button></header>
<main id="main"></main><footer class="footer"><div class="container"><a class="brand" href="/" style="font-size:17px"><i style="width:17px;height:17px"></i>ROBOT <span>FORGE</span></a><span class="small">© 2026 Robot Forge · Public development preview · Not production CAD</span></div></footer>
<script>
const CAD = '<svg class="cad-art" viewBox="0 0 500 390" role="img" aria-label="Illustrative mechanical arm geometry, not a generated CAD result"><defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#8cdbff"/><stop offset="1" stop-color="#398bd7"/></linearGradient><linearGradient id="m" x1="0" x2="1"><stop stop-color="#457fae"/><stop offset="1" stop-color="#8dcef5"/></linearGradient></defs><ellipse cx="255" cy="331" rx="170" ry="26" fill="#000" opacity=".28"/><path d="M114 306 218 260 331 306 227 351Z" fill="#659ac6" stroke="#95d3fc" stroke-width="3"/><path d="M114 306v22l113 43v-20M331 306v22l-104 43" fill="#4778a6" stroke="#8abeec" stroke-width="2"/><ellipse cx="225" cy="269" rx="49" ry="19" fill="#5385b0" stroke="#b4e3ff" stroke-width="4"/><path d="M199 265 236 165 278 178 247 282Z" fill="url(#m)" stroke="#aff28c" stroke-width="4"/><path d="M221 164 309 85 339 112 256 197Z" fill="url(#g)" stroke="#d8ffc0" stroke-width="4"/><circle cx="237" cy="178" r="30" fill="#1d402b" stroke="#b8e5ff" stroke-width="6"/><circle cx="237" cy="178" r="12" fill="#badbac"/><circle cx="321" cy="100" r="22" fill="#3a8dc7" stroke="#c1ebff" stroke-width="5"/><path d="M340 94 375 73 391 87 358 116Z" fill="#4da5d9" stroke="#daefff" stroke-width="3"/><path d="M378 73 416 54M391 87l41 12" fill="none" stroke="#b8ff86" stroke-width="8" stroke-linecap="round"/><path d="M237 178l-60-33M321 100l55-44" stroke="#a9c99e" stroke-dasharray="4 8" opacity=".65"/></svg>';
const route = location.pathname.replace(/\/+$/,'')||'/';
const titles={'/':'Robot Forge — Engineering, reimagined.','/workspace':'Workspace · Robot Forge','/login':'Sign in · Robot Forge','/plans':'Plans · Robot Forge','/docs':'Documentation · Robot Forge','/release-notes':'Release notes · Robot Forge','/careers':'Careers · Robot Forge'};
document.title = titles[route]||titles['/'];
document.querySelectorAll('.navlinks a').forEach(a=>{if(new URL(a.href).pathname.replace(/\/+$/,'')===route)a.classList.add('active')});
document.getElementById('burger').addEventListener('click',()=>document.getElementById('navlinks').classList.toggle('show'));
const intro=(tag,title,sub)=>'<section class="pagehero"><div class="container"><div class="eyebrow">'+tag+'</div><h1>'+title+'</h1><p>'+sub+'</p></div></section>';
const card=(glyph,title,desc,chip)=>'<article class="card"><div class="glyph">'+glyph+'</div><h3>'+title+'</h3><p>'+desc+'</p><div class="chip">'+chip+'</div></article>';
const panel=(inner)=>'<div class="panel">'+inner+'</div>';
function home(){return '<section class="hero"><div class="container hero-grid"><div><div class="eyebrow">● Development prototype v1.8 <small> / MADE FOR BUILDERS</small></div><h1>From idea<br>to <em>geometry.</em></h1><p class="lead">The engineering workspace for robotics. Plan a part, model real geometry locally, inspect design revisions and export fabrication-friendly formats — all in one place.</p><div class="actions"><a class="primary" href="/workspace/">Explore workspace ↗</a><a class="secondary" href="/docs/">Read documentation →</a></div><div class="small">✓ CadQuery / OCC local prototype &nbsp; · &nbsp; ✓ STEP / STL / GLB exports &nbsp; · &nbsp; ✓ Clear validation status</div><div class="stats"><div class="stat"><b>06</b><span>CAD template types</span></div><div class="stat"><b>02</b><span>Planar joints</span></div><div class="stat"><b>v1.8</b><span>Prototype release</span></div></div></div><div class="mock"><div class="mockhead"><i class="dot"></i><i class="dot"></i><i class="dot"></i><small>ROBOT FORGE / ENGINEERING WORKSPACE</small></div><div class="mockbody"><div class="mocksidebar"><div class="mocklabel">PROJECT</div><div class="item on">◇ Assembly</div><div class="item">▣ Parts</div><div class="item">◉ Joints</div><div class="item">⌁ Electronics</div><div class="item">✦ AI Tasks</div></div><div class="canvas">'+CAD+'</div><div class="mockright"><div class="mocklabel">INSPECTOR</div><div class="mval">GEOMETRY<strong>2-DOF Arm</strong></div><div class="mval">KERNEL<strong>B-rep</strong></div><div class="mval">OUTPUT<strong>STEP · STL</strong></div><div class="mval"><b>PREVIEW ONLY</b></div></div></div></div></div></section><section class="section"><div class="container"><div class="sectionhead"><div><div class="eyebrow">ONE CONNECTED TOOLCHAIN</div><h2>Engineering tools.<br>Less friction.</h2></div><p>We are building capability by capability, with real files and transparent verification instead of empty feature claims.</p></div><div class="cards">'+card('⬡','Parametric CAD','Generate constrained geometry with a local CadQuery engine and downloadable CAD artifacts.','LOCAL MVP')+card('⤳','Assembly revisions','Regenerate a 2-DOF mechanism with updated dimensions, joint angles and version records.','EARLY PROTOTYPE')+card('✳','AI-assisted planning','Optional model planner translates a request into a bounded, validated CAD template.','API KEY REQUIRED')+card('▤','Engineering review','Inspect basic fit checks, analytical torque estimates and assumptions.','LOCAL PROTOTYPE')+card('◎','PCB and wiring','Produce KiCad schematic / unrouted board drafts, connector maps and wiring lists.','DRAFT ONLY')+card('⌁','Simulation & sourcing','Dynamic simulation and verified supplier lookup are planned, not yet online.','ROADMAP')+'</div></div></section><section class="band"><div class="container twocol"><div><div class="eyebrow">ENGINEERING, NOT MAGIC</div><h2 style="font-size:49px;letter-spacing:-2px">Real execution.<br>Clear boundaries.</h2><p class="lead">The local application generates actual B-rep solids. The public preview supports browser-side mesh edits but not cloud CAD execution.</p><a href="/release-notes/" class="secondary">See what is shipped →</a></div><div class="pipeline"><div class="step"><b>01</b><div><strong>Describe the component</strong><p>Part dimensions, budget, material and constraints</p></div></div><div class="step"><b>02</b><div><strong>Validate a supported template</strong><p>Guard dimensions and tool permissions</p></div></div><div class="step"><b>03</b><div><strong>Execute the local CAD kernel</strong><p>Real geometry, artifacts and logs</p></div></div><div class="step"><b>04</b><div><strong>Review and export</strong><p>Inspect assumptions, revise and download</p></div></div></div></div></section>'}
function login(){return intro('ACCOUNT ACCESS','Build with clarity.','Sign-in and project storage are intentionally disabled on this public UI preview.')+'<section class="content"><div class="container" style="max-width:560px">'+panel('<div class="eyebrow">PREVIEW MODE</div><h2 style="margin-top:10px;font-size:31px">Sign in to Robot Forge</h2><label class="field">Email address<input placeholder="you@example.com" type="email" disabled autocomplete="off"></label><label class="field">Password<input placeholder="••••••••" type="password" disabled autocomplete="off"></label><button class="primary" disabled style="opacity:.5">Sign in — disabled in preview</button><p class="warn">This is a visual preview. Do not enter personal information. Accounts are available only in the locally installed prototype.</p>')+'</div></section>'}
function plans(){return intro('PLANS & PRICING','Build more. Pay only when it works.','The public demo is free. The plans below illustrate future product tiers; no paid subscriptions are active.')+'<section class="content"><div class="container"><div class="pricing"><div class="price"><div class="eyebrow">LOCAL MVP</div><h3>Free</h3><b>$0</b><p class="muted">Personal prototypes and engineering exploration.</p><ul><li>Public UI demo</li><li>Local CAD environment</li><li>CAD exports on supported templates</li></ul><span class="chip">AVAILABLE LOCALLY</span></div><div class="price featured"><div class="eyebrow">PLANNED</div><h3>Maker</h3><b>Coming soon</b><p class="muted">Future cloud engineering tools for individual builders.</p><ul><li>Cloud project workspaces</li><li>Expanded CAD automation</li><li>Artifact storage</li></ul><span class="chip">NOT FOR SALE</span></div><div class="price"><div class="eyebrow">PLANNED</div><h3>Team</h3><b>Coming soon</b><p class="muted">Collaboration, reviews and organizational control.</p><ul><li>Team reviews</li><li>Permissions</li><li>Advanced engineering workers</li></ul><span class="chip">NOT FOR SALE</span></div></div></div></section>'}
function docs(){return intro('DOCUMENTATION','Engineering knowledge, organized.','Get started with the local prototype and understand what the online demo does — and does not — execute.')+'<section class="content"><div class="container cols2">'+panel('<h3>01 / Getting started</h3><p class="muted">Download and extract the Robot Forge v1.8 local source package. Install Python 3.12 with the listed dependencies. Run the included Windows launcher and open <code>http://127.0.0.1:8000</code>.</p><h3>02 / Generate CAD</h3><p class="muted">Use a supported template such as a mounting plate, simple bracket or 2R arm. Local CAD generation exports STEP/STL/GLB.</p><h3>03 / Review</h3><p class="muted">Read geometry checks, explicit assumptions and version history before manufacturing.</p>')+panel('<h3>Important limitations</h3><p class="muted">The hosted Render preview has no CAD worker, user accounts, private database, OpenAI keys, payments or simulation execution.</p><p class="muted">KiCad schematic and board outputs are drafts. Official ERC/DRC and physical safety checks remain required before fabrication.</p><h3>Roadmap</h3><p class="muted">Engine-backed EDA verification · secure cloud workers · reliable artifact storage · bounded multi-agent execution.</p><a class="primary" href="/workspace/">See UI preview ↗</a>')+'</div></section>'}
function notes(){return intro('CHANGELOG','Release notes.','A transparent record of prototype milestones; no unverified feature is marked production-ready.')+'<section class="content"><div class="container" style="max-width:920px">'+[['v1.8 · UI & wiring draft','Fixed stylesheet paths, introduced UI-only offline preview, created unrouted KiCad PCB and harness metadata.'],['v1.7 · Electronics integration','Added AX-18A design screening and editable KiCad schematic drafts. Official ERC still pending.'],['v1.6 · Engineering review','Added bounded CAD modification approvals, basic assembly checks and 2R torque estimates.'],['v1.4–1.5 · Product experience','Introduced landing, documentation, account pages and engineering review interface.'],['v1.2–1.3 · Geometry foundation','Built the initial local CAD execution and editable project artifacts.']].map(x=>'<div class="lineitem"><small>PROTOTYPE MILESTONE</small><h3 style="margin:10px 0">'+x[0]+'</h3><p>'+x[1]+'</p></div>').join('')+'</div></section>'}
function careers(){return intro('CAREERS','Build tools for people who build robots.','Robot Forge is an early experimental project. No currently open paid positions are being advertised.')+'<section class="content"><div class="container"><div class="cards">'+card('⌘','Robotics engineering','Mechanical design, motion systems and engineering validation.','FUTURE FOCUS')+card('✳','Applied AI systems','Tool-calling agents, guarded actions and execution tracing.','FUTURE FOCUS')+card('◇','Frontend engineering','High-density interactive 3D tools and precise creative UI.','FUTURE FOCUS')+'</div><p class="muted" style="margin-top:24px">Hiring information will be published only if real openings exist.</p></div></section>'}
function workspace(){return intro('ENGINEERING WORKSPACE','Your ideas, in context.','Interactive interface preview. CAD files are not generated on this public Render site.')+'<section class="content" style="padding-top:10px"><div class="container"><div class="work"><div class="workside"><div class="worktitle">PROJECT EXPLORER</div>'+['CAD Studio','Assembly','Electronics','PCB layout','Wiring harness','Engineering review','AI Task log'].map((n,i)=>'<button class="worktab '+(i===0?'sel':'')+'" data-tab="'+n+'">◇ '+n+'</button>').join('')+'</div><div class="workmain"><div class="viewhead"><span id="viewlabel">CAD Studio · DEMO PREVIEW</span><span>ISOMETRIC · FRONT · TOP</span></div><div class="viewcenter" id="viewer">'+CAD+'</div><div class="viewfoot">VISUAL SCHEMATIC · NOT LIVE CAD · V1.8 STATIC PREVIEW</div></div><div class="workinfo"><div class="worktitle">OBJECT INSPECTOR</div><div class="panel"><p class="muted">Selected object</p><h3 style="font-size:16px">2-DOF demonstration arm</h3><label class="field">Link A (mm)<input disabled value="120"></label><label class="field">Link B (mm)<input disabled value="90"></label><label class="field">Material<input disabled value="Prototype only"></label><button class="primary" disabled style="opacity:.56">Generate CAD — offline</button><div class="warn">The preview does not execute CAD or store projects. Download and run the local v1.8 source for supported functions.</div></div></div></div></div></section>'}
const content={'/':home,'/login':login,'/plans':plans,'/docs':docs,'/release-notes':notes,'/careers':careers,'/workspace':workspace};
document.getElementById('main').innerHTML=(content[route]||home)();
document.querySelectorAll('.worktab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.worktab').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');document.getElementById('viewlabel').textContent=b.dataset.tab+' · UI PREVIEW'}));
</script></body></html>
