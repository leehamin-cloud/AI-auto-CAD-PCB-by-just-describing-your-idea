name: Robot Forge PCB - schematic logic, footprint refs and KiCad draft checks

on:
  push:
    branches:
      - robot-forge-v18-render-preview
    paths:
      - 'public/workspace/pcb-studio.js'
      - 'public/workspace/pcb-netlist.js'
      - 'public/workspace/pcb-parts.js'
      - 'public/workspace/pcb-pad-library.js'
      - 'public/workspace/pcb-parity.js'
      - 'public/workspace/pcb-schematic.js'
      - 'public/workspace/pcb-kicad-schematic.js'
      - 'scripts/test-pcb-v26.cjs'
      - 'scripts/verify-kicad-parity.py'
      - 'scripts/test-kicad-parity.py'
      - '.github/workflows/robot-forge-pcb.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logical-netlist-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check browser PCB nets, footprints and geometry
        run: node scripts/test-pcb-v26.cjs
      - name: Check independent KiCad file parity parser
        run: python3 scripts/test-kicad-parity.py

  kicad-draft-parse-and-drc:
    needs: logical-netlist-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad 9 CLI from official KiCad Ubuntu PPA
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad
          kicad-cli version

      - name: Generate PCB and experimental KiCad schematic from browser exporters
        run: |
          mkdir -p "$RUNNER_TEMP/robot-forge-pcb"
          OUTPUT_DIR="$RUNNER_TEMP/robot-forge-pcb" node scripts/test-pcb-v26.cjs

      - name: Parse experimental KiCad schematic and extract electrical netlist
        run: |
          kicad-cli sch export netlist \
            --format kicadsexpr \
            -o "$RUNNER_TEMP/robot-forge-pcb/parsed-schematic.net" \
            "$RUNNER_TEMP/robot-forge-pcb/robot-forge-draft.kicad_sch"
          test -s "$RUNNER_TEMP/robot-forge-pcb/parsed-schematic.net"
          kicad-cli sch export netlist \
            --format kicadxml \
            -o "$RUNNER_TEMP/robot-forge-pcb/parsed-schematic.xml" \
            "$RUNNER_TEMP/robot-forge-pcb/robot-forge-draft.kicad_sch"
          test -s "$RUNNER_TEMP/robot-forge-pcb/parsed-schematic.xml"


      - name: Render schematic SVG through KiCad
        run: |
          mkdir -p "$RUNNER_TEMP/robot-forge-pcb/schematic-svg"
          kicad-cli sch export svg \
            -o "$RUNNER_TEMP/robot-forge-pcb/schematic-svg" \
            "$RUNNER_TEMP/robot-forge-pcb/robot-forge-draft.kicad_sch"

      - name: Run official schematic ERC and record findings
        id: erc
        run: |
          set +e
          kicad-cli sch erc \
            --format json --severity-all --exit-code-violations \
            -o "$RUNNER_TEMP/robot-forge-pcb/official-erc.json" \
            "$RUNNER_TEMP/robot-forge-pcb/robot-forge-draft.kicad_sch"
          result=$?
          set -e
          echo "KiCad ERC exit code: $result" | tee "$RUNNER_TEMP/robot-forge-pcb/erc-status.txt"
          if [ "$result" -eq 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi
          echo "ERC report captured; manufacturer parts still unverified."

      - name: Verify KiCad can parse and render the draft
        run: |
          mkdir -p "$RUNNER_TEMP/robot-forge-pcb/svg"
          kicad-cli pcb export svg \
            --layers F.Cu,Edge.Cuts \
            --output "$RUNNER_TEMP/robot-forge-pcb/svg" \
            "$RUNNER_TEMP/robot-forge-pcb/robot-forge-demo.kicad_pcb"

      - name: Independently compare KiCad schematic XML with PCB pads and nets
        run: |
          python3 scripts/verify-kicad-parity.py \
            --manifest "$RUNNER_TEMP/robot-forge-pcb/robot-forge-parity.json" \
            --pcb "$RUNNER_TEMP/robot-forge-pcb/robot-forge-demo.kicad_pcb" \
            --schematic-xml "$RUNNER_TEMP/robot-forge-pcb/parsed-schematic.xml" \
            --report "$RUNNER_TEMP/robot-forge-pcb/ki-cad-file-parity.json"

      - name: Run official KiCad PCB DRC and record findings
        id: drc
        run: |
          set +e
          kicad-cli pcb drc \
            --format json \
            --severity-all \
            --exit-code-violations \
            -o "$RUNNER_TEMP/robot-forge-pcb/official-drc.json" \
            "$RUNNER_TEMP/robot-forge-pcb/robot-forge-demo.kicad_pcb"
          exit_code=$?
          set -e
          printf 'KiCad DRC exit code: %s\n' "$exit_code" | tee "$RUNNER_TEMP/robot-forge-pcb/drc-status.txt"
          if [ "$exit_code" -eq 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi
          echo "DRC report captured; manufacturer parts still unverified."

      - name: Export diagnostic Gerber and drill previews (only when ERC and DRC pass)
        if: steps.erc.outputs.passed == 'true' && steps.drc.outputs.passed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/robot-forge-pcb/diagnostic-gerbers"
          kicad-cli pcb export gerbers \
            --layers F.Cu,B.Cu,F.SilkS,B.SilkS,F.Mask,B.Mask,Edge.Cuts \
            --output "$RUNNER_TEMP/robot-forge-pcb/diagnostic-gerbers/" \
            "$RUNNER_TEMP/robot-forge-pcb/robot-forge-demo.kicad_pcb"
          kicad-cli pcb export drill \
            --output "$RUNNER_TEMP/robot-forge-pcb/diagnostic-gerbers/" \
            "$RUNNER_TEMP/robot-forge-pcb/robot-forge-demo.kicad_pcb"
          echo "DIAGNOSTIC PREVIEW ONLY. Footprint geometry and real component datasheets are unverified." \
            > "$RUNNER_TEMP/robot-forge-pcb/diagnostic-gerbers/NOT_FOR_MANUFACTURING.txt"

      - name: Enforce official ERC and DRC diagnostic gate
        if: always() && steps.erc.outcome == 'success' && steps.drc.outcome == 'success'
        run: |
          echo "ERC: ${{ steps.erc.outputs.passed }} | DRC: ${{ steps.drc.outputs.passed }}"
          if [ "${{ steps.erc.outputs.passed }}" != "true" ] || [ "${{ steps.drc.outputs.passed }}" != "true" ]; then
            echo "Blocking KiCad draft: ERC and/or DRC violations remain."
            exit 1
          fi
          echo "No ERC/DRC violations found; manufacturer part matching remains unverified."

      - name: Upload generated drafts, ERC and DRC reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-forge-kicad-draft-validation
          path: ${{ runner.temp }}/robot-forge-pcb
          retention-days: 7
          if-no-files-found: warn
